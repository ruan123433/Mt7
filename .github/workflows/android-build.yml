
name: MT7 - Diagnostico do codigo

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    name: Preparar diagnostico MT7
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v6

      - name: Extrair codigo MT7
        run: |
          archive="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$archive" ]; then
            echo "ERRO: ZIP do MT7 nao encontrado na raiz."
            exit 1
          fi

          mkdir -p /tmp/mt7-source
          unzip -q "$archive" -d /tmp/mt7-source

          settings_file="$(find /tmp/mt7-source -type f -name settings.gradle.kts -print -quit)"

          if [ -z "$settings_file" ]; then
            echo "ERRO: Projeto Gradle nao encontrado."
            exit 1
          fi

          project_dir="$(dirname "$settings_file")"
          rsync -a --exclude='.github/' "$project_dir"/ ./

          test -f app/build.gradle.kts
          test -d app/src

      - name: Preparar arquivos para diagnostico
        run: |
          mkdir -p mt7-diagnostico

          files=(
            "app/src/main/java/com/mt7/keymapper/core/activation/PrivilegedCommandRunner.kt"
            "app/src/main/java/com/mt7/keymapper/core/devices/InputDeviceInspector.kt"
            "app/src/main/java/com/mt7/keymapper/core/injection/UinputTouchSession.kt"
            "app/src/main/java/com/mt7/keymapper/core/input/OtgInputEventReader.kt"
            "app/src/main/java/com/mt7/keymapper/ui/MT7App.kt"
            "app/src/main/java/com/mt7/keymapper/ui/devices/MouseDiagnosticsPanel.kt"
            "app/build.gradle.kts"
            "build.gradle.kts"
            "gradle/libs.versions.toml"
          )

          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              mkdir -p "mt7-diagnostico/$(dirname "$file")"
              cp "$file" "mt7-diagnostico/$file"
              echo "OK: $file"
            else
              echo "AUSENTE: $file"
            fi
          done

          echo "Diagnostico preparado."

      - name: Compactar diagnostico
        run: |
          zip -qr mt7-source-diagnostico.zip mt7-diagnostico

      - name: Disponibilizar arquivos
        uses: actions/upload-artifact@v4
        with:
          name: mt7-source-diagnostico
          path: mt7-source-diagnostico.zip
          if-no-files-found: error
          retention-days: 7
          
