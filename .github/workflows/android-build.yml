
name: Build MT7 Keymapper APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    name: Inspect and Build MT7
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Extract MT7 source ZIP
        run: |
          archive="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$archive" ]; then
            echo "ZIP do MT7 não encontrado"
            exit 1
          fi

          mkdir -p /tmp/mt7-source
          unzip -q "$archive" -d /tmp/mt7-source

          settings_file="$(find /tmp/mt7-source -type f -name settings.gradle.kts -print -quit)"

          if [ -z "$settings_file" ]; then
            echo "Projeto Gradle não encontrado"
            exit 1
          fi

          project_dir="$(dirname "$settings_file")"
          rsync -a --exclude='.github/' "$project_dir"/ ./

          test -f app/build.gradle.kts
          test -d app/src

      - name: Show Kotlin files with errors
        run: |
          for file in \
            app/src/main/java/com/mt7/keymapper/core/activation/PrivilegedCommandRunner.kt \
            app/src/main/java/com/mt7/keymapper/core/devices/InputDeviceInspector.kt \
            app/src/main/java/com/mt7/keymapper/core/injection/UinputTouchSession.kt \
            app/src/main/java/com/mt7/keymapper/core/input/OtgInputEventReader.kt \
            app/src/main/java/com/mt7/keymapper/ui/MT7App.kt \
            app/src/main/java/com/mt7/keymapper/ui/devices/MouseDiagnosticsPanel.kt
          do
            echo ""
            echo "========== $file =========="
            if [ -f "$file" ]; then
              cat "$file"
            else
              echo "ARQUIVO NÃO ENCONTRADO"
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build packages
        run: |
          sdkmanager --install \
            "platforms;android-37" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Build MT7
        run: |
          echo "Inspeção concluída. Aguardando correções no código."
          
