
name: Build MT7 Keymapper APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    name: Build MT7 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Extract MT7 source ZIP
        run: |
          archive="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$archive" ]; then
            echo "ZIP do MT7 não encontrado na raiz"
            exit 1
          fi

          mkdir -p /tmp/mt7-source
          unzip -q "$archive" -d /tmp/mt7-source

          settings_file="$(find /tmp/mt7-source -type f -name settings.gradle.kts -print -quit)"

          if [ -z "$settings_file" ]; then
            echo "settings.gradle.kts não encontrado no ZIP"
            exit 1
          fi

          project_dir="$(dirname "$settings_file")"
          rsync -a --exclude='.github/' "$project_dir"/ ./

          test -f app/build.gradle.kts
          test -d app/src

      - name: Configure Gradle compatibility
        run: |
          echo "android.sourceset.disallowProvider=false" >> gradle.properties

      - name: Inspect MT7 Android configuration
        run: |
          echo "===== APP BUILD GRADLE ====="
          cat app/build.gradle.kts

          echo "===== GRADLE PROPERTIES ====="
          cat gradle.properties

          echo "===== VERSION CATALOG ====="
          if [ -f gradle/libs.versions.toml ]; then
            cat gradle/libs.versions.toml
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Check available Android SDK platforms
        run: |
          sdkmanager --list

      - name: Install Android build packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Test and build APK
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mt7-keymapper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
